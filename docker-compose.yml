version: "3.9"

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:routeopt@db:5432/routeopt
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  # ── React Dashboard ─────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../docker/Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: routeopt
      POSTGRES_DB:       routeopt
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── SUMO Simulation (optional) ──────────────────────────────────────────────
  sumo:
    build:
      context: ./simulation
      dockerfile: ../docker/Dockerfile.sumo
    volumes:
      - ./data/sumo:/maps
    environment:
      - SUMO_CFG=/maps/default.sumocfg
    profiles:
      - sumo      # only started with: docker compose --profile sumo up
    restart: unless-stopped

volumes:
  pgdata:
